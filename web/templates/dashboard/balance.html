{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="bi bi-wallet2"></i> Текущий баланс</h5>
            </div>
            <div class="card-body text-center">
                <h1 class="display-1">{{ balance }}</h1>
                <p>кредитов</p>
                <form method="post" action="/balance/deposit">
                    <div class="input-group mb-3">
                        <input type="number" class="form-control" name="amount" placeholder="Сумма" min="1" required>
                        <button class="btn btn-success" type="submit">Пополнить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
