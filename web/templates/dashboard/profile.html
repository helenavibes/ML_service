{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-person-circle"></i> Профиль</h5>
            </div>
            <div class="card-body">
                <p><strong>Имя пользователя:</strong> {{ user.username }}</p>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Роль:</strong> <span class="badge bg-info">{{ user.role }}</span></p>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="bi bi-wallet2"></i> Баланс</h5>
            </div>
            <div class="card-body">
                <h2>{{ balance }} кредитов</h2>
                <a href="/balance" class="btn btn-success mt-2">Пополнить</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
